<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FELIZ CUMPLE AOI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<style>
    body{
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        box-sizing: border-box;
        background-color: antiquewhite;
    }

    img {
        width: 200px;
    }
</style>
<body class="bg-light m-0 p-0">
    <div class="d-grid vh-100 " style="
        grid-template-rows: 1fr 2fr 1fr; 
        grid-template-columns: 1fr 2fr 1fr; 
        ">

        <header class="border border-2 border-danger shadow-sm bg-white d-flex align-items-center justify-content-center" 
                style="grid-column: 1 / span 3; overflow: hidden;">
            <img src="IMG/Emilia.png" alt="Emilia" style="height: 80%; width: auto; object-fit: contain;">
        </header>

        <div class="border border-2 border-danger shadow-sm" style="background-color: #fdf0e0;"></div>
        
        <main class="bg-white border border-2 border-dark shadow d-flex align-items-center justify-content-center">
            <h3 class="text-muted">Contenido / Video</h3>
        </main>

        <div class="border border-2 border-danger shadow-sm" style="background-color: #fdf0e0;"></div>

        <footer class="border border-2 border-danger shadow-sm" 
                style="background-color: #fdf0e0; grid-column: 1 / span 3;">
        </footer>
    </div>
</body>
</html>
