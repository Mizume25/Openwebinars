<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestoría Estudiantil Pro | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="Gestoria.css">
</head>
<body class="bg-light-subtle">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#"><i class="fas fa-graduation-cap me-2 text-info"></i>ACADEMY PRO</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="nav nav-pills ms-auto" id="mainNav">
                    <li class="nav-item"><a class="nav-link active" href="#" data-curso="1">1º</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="#" data-curso="2">2º</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="#" data-curso="3">3º</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="#" data-curso="4">4º</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="#" data-curso="5">Todos</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container-fluid py-4">
        <div class="row g-4">
            
            <aside class="col-lg-2">
                <div class="card border-0 shadow-sm mb-4 sticky-top" style="top: 80px;">
                    <div class="card-body">
                        <h6 class="text-muted text-uppercase small fw-bold mb-3">Acciones</h6>
                        <div class="d-grid gap-2">
                            <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#modalAdd">
                                <i class="fas fa-plus-circle me-2"></i>Nuevo Alumno
                            </button>
                            <button class="btn btn-outline-secondary btn-sm" data-bs-toggle="modal" data-bs-target="#modalEdit">
                                <i class="fas fa-edit me-2"></i>Editar
                            </button>
                            <button class="btn btn-outline-danger btn-sm">
                                <i class="fas fa-trash-alt me-2"></i>Eliminar
                            </button>
                        </div>
                        <hr class="my-4">
                        <h6 class="text-muted text-uppercase small fw-bold mb-3">Filtros Avanzados</h6>
                        <select class="form-select form-select-sm border-0 bg-light" id="filter-materia">
                            <option value="general">Materia: Todas</option>
                            <option value="mates">Matemáticas</option>
                            <option value="lengua">Lengua</option>
                        </select>
                    </div>
                </div>
            </aside>

            <section class="col-lg-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="mb-0 fw-bold text-secondary">Listado de Estudiantes</h5>
                            <small class="text-muted" id="tutor-info-table">
                                <i class="fas fa-chalkboard-teacher me-1"></i> Tutor: <span id="nombre-tutor-texto" class="fw-semibold text-primary">---</span>
                            </small>
                        </div>
                        <span class="badge bg-info-subtle text-info px-3 py-2 rounded-pill">Ciclo 2026</span>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0" id="main-table">
                                <thead class="table-light text-muted small uppercase">
                                    <tr>
                                        <th class="ps-4">ID</th>
                                        <th>Alumno</th>
                                        <th>Edad</th>
                                        <th>Curso</th>
                                        <th>Mates</th>
                                        <th>Lengua</th>
                                        <th>Media</th>
                                        <th class="text-end pe-4">Acción</th>
                                    </tr>
                                </thead>
                                <tbody id="table-body" class="border-top-0">
                                    </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>
            
            <aside class="col-lg-2">
                <div class="card border-0 shadow-sm border-start border-info border-4 mb-4">
                    <div class="card-body">
                        <h6 class="fw-bold mb-3 small"><i class="fas fa-layer-group text-info me-2"></i>Optativas</h6>
                        <div class="list-group list-group-flush gap-2" id="optativas">
                            <button class="list-group-item list-group-item-action rounded border small py-2" value="Teatro">Taller Teatro</button>
                            <button class="list-group-item list-group-item-action rounded border small py-2" value="Robótica">Robótica</button>
                            <button class="list-group-item list-group-item-action rounded border small py-2" value="Coro">Coro</button>
                        </div>
                    </div>
                </div>

                <div class="card border-0 shadow-sm overflow-hidden" id="card-profesor">
                    <div class="bg-primary py-2 text-center text-white small fw-bold">TUTORÍA</div>
                    <div class="card-body text-center py-4">
                        <div class="mb-3 position-relative d-inline-block">
                            <img src="#" id="profesor-img" class="rounded-circle border border-3 border-white shadow-sm" alt="Foto Profesor" style="width: 80px; height: 80px; object-fit: cover;">
                            <span class="position-absolute bottom-0 end-0 bg-success border border-2 border-white rounded-circle" style="width: 15px; height: 15px;"></span>
                        </div>
                        <h6 class="mb-0 fw-bold" id="profesor-nombre">---</h6>
                        <p class="text-muted small mb-3" id="profesor-materia">---</p>
                        <div class="d-flex justify-content-center gap-2">
                            <button class="btn btn-sm btn-light rounded-circle shadow-sm" title="Contactar"><i class="fas fa-envelope text-primary"></i></button>
                            <button class="btn btn-sm btn-light rounded-circle shadow-sm" title="Horario"><i class="fas fa-calendar-alt text-secondary"></i></button>
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <div class="modal fade" id="modalAdd" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title">Registrar Estudiante</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="form-create" class="row g-3">
                        <div class="col-6"><input type="text" class="form-control" placeholder="Nombre" required></div>
                        <div class="col-6"><input type="text" class="form-control" placeholder="Apellidos" required></div>
                        <div class="col-12">
                            <select class="form-select">
                                <option value="1">1º Curso</option>
                                <option value="2">2º Curso</option>
                                <option value="3">3º Curso</option>
                                <option value="4">4º Curso</option>
                            </select>
                        </div>
                        <div class="col-12"><button type="submit" class="btn btn-success w-100 py-2">Confirmar Alta</button></div>
                    </form>
                </div>
            </div>
        </div>
    </div>

<script type="module" src="./components/module/main.js"></script>
</body>
</html>
