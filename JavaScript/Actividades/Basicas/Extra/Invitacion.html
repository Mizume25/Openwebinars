<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitacion</title>
    <link rel="stylesheet" href="Invitacion.css">
    <link rel="shortcut icon" href="IMG/Turtle1.png" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
<div class="main-container">
    <aside class="side-panel"></aside>

    <main class="content">
        <header class="main-header">
            <h1>Invitacion de San Valentin</h1>
        </header>

        <section class="glass-card">
            <div class="card-info">
                <div class="title-container">
                    <h2>¿Luana quieres ser mi San Valentin?</h2>
                </div>
                <div class="button-group">
                    <button id="SI">SI</button>
                    <button id="pensar">Tengo que pensarlo</button>
                    <button id="NO">No</button>
                </div>
                 <p id="suplicar"></p>
            </div>
           
            
            <div class="image-placeholder" id="imgT">

            </div>
        </section>
    </main>

    <aside class="side-panel"></aside>
</div>
<script src="Invitaciones.js"></script>
</body>
</html>
