<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanguard Thread</title>
    <link rel="stylesheet" href="Act5.css">
</head>
<body>
<nav class="navbar">
    <div class="logo">VANGUARD<span>THREAD</span></div>
    <div class="search-wrapper">
        <input type="text" id="buscador" placeholder="Busca tu estilo...">
    </div>
</nav>

<section class="filter-bar">
    <div class="filter-item">
        <label>Categoría</label>
        <select id="filter-categoria">
            <option value="todos">Todas</option>
            <option value="camisas">Camisas</option>
            <option value="pantalones">Pantalones</option>
            <option value="zapatos">Zapatos</option>
            <option value="complementos">Complementos</option>
        </select>
    </div>

    <div class="filter-item">
        <label>Género</label>
        <div class="radio-group-horizontal">
            <label><input type="radio" name="genero" value="todos" checked> Todos</label>
            <label><input type="radio" name="genero" value="unisex"> Unisex</label>
            <label><input type="radio" name="genero" value="hombre"> Hombre</label>
            <label><input type="radio" name="genero" value="mujer"> Mujer</label>
        </div>
    </div>

    <div class="filter-item">
        <label>Ordenar</label>
        <select id="sort-order">
            <option value="general-order">General</option>
            <option value="precio-asc">Precio: Bajo a Alto</option>
            <option value="precio-desc">Precio: Alto a Bajo</option>
            <option value="fecha-desc">Novedad</option>
            <option value="fecha-asc">Antiguedad</option>
        </select>
    </div>
</section>

<main id="catalogo-grid" class="grid"></main>
