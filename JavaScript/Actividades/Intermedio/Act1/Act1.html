<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Seguro</title>
    <link rel="stylesheet" href="Act1.css">
</head>
<body>

    <div class="form-card">
        <h2>Crear cuenta</h2>
        <form id="registration-form">
            <div class="form-group">
                <label for="username">Nombre de usuario</label>
                <input type="text" id="username" placeholder="Ej: JuanPerez"autocomplete="new-username">
                <span id="error-username" class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
                <span id="error-password" class="error-message"></span>
            </div>

            <button id="submit-btn">Registrarse</button>
            <button id="show-btn">Ver user</button>
            <ul id="showUs">

            </ul>
        </form>
    </div>

    <script src="Act1.js"></script>
</body>
</html>
