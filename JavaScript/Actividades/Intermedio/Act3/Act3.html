<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Supermercado JS</title>
    <link rel="stylesheet" href="Act3.css">
</head>

<body>

    <div class="container">
        <h2>🛒 Gestor de Inventario</h2>
        <input type="text" id="inputBusqueda" placeholder="Nombre del producto (ej: Tomate)">
        <button id="btnBuscar">Buscar Producto Especifico</button>
        <button id="btnMostrar">Mostrar todos los productos</button>
        <button id="btnVerduras">Solo Verduras</button>
        <button id="btnOfertas">Ofertas</button>
        <button id="btnocultar">Ocultar Productos</button>
        <button id="search">Buscar</button>
        <div id="display" class="result-box">

        </div>
    </div>

    <aside class="sidebar">
        <div class="widget">
            <h3>🛒 Carrito</h3>
            <p>Items escogidos: <span id="contadorCarrito" class="count-value"></span></p>
            <p>Compra total: <span id="bill" class="count-value"></span>&nbsp;€</p>
        </div>
        <button id="list-User">Ver Compra</button>
        <button id="list-delete">Ocultar compra</button>
        <div id="list" class="result-box">
        
        </div>
        </div>
    </aside>

    <!--<div class="card">
                <span class="badge">${v.categoria}</span>
                <h4>${v.nombre}</h4>
                <p><strong>Precio:</strong> ${v.precio}€</p>
                <p>Stock: ${v.stock}</p>
            </div>
            -->
    <script src="Act3.js"></script>
</body>

</html>
